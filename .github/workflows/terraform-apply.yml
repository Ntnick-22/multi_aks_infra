name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      target_layer:
        description: "Apply up to and including this layer"
        required: true
        type: choice
        options:
          - 04_databases
          - 03_vm
          - 01_networking
          - 00_rg

permissions:
  id-token: write
  contents: write

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  apply-rg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: live/${{ inputs.environment }}/00_rg
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: live/${{ inputs.environment }}/00_rg
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
          exit 0

      - name: Terraform Apply
        working-directory: live/${{ inputs.environment }}/00_rg
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: always()
        working-directory: live/${{ inputs.environment }}/00_rg
        run: terraform output -no-color || true

      - name: Logout
        if: always()
        run: az logout

  apply-networking:
    needs: apply-rg
    if: success() && contains(fromJSON('["01_networking","03_vm","04_databases"]'), inputs.target_layer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: live/${{ inputs.environment }}/01_networking
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: live/${{ inputs.environment }}/01_networking
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
          exit 0

      - name: Terraform Apply
        working-directory: live/${{ inputs.environment }}/01_networking
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: always()
        working-directory: live/${{ inputs.environment }}/01_networking
        run: terraform output -no-color || true

      - name: Logout
        if: always()
        run: az logout

  apply-vm:
    needs: apply-networking
    if: success() && contains(fromJSON('["03_vm","04_databases"]'), inputs.target_layer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Generate VM SSH tfvars
        working-directory: live/${{ inputs.environment }}/03_vm
        env:
          VM_SSH_PUBLIC_KEY: ${{ secrets.VM_SSH_PUBLIC_KEY }}
        run: printf 'admin_ssh_public_key = "%s"\n' "${VM_SSH_PUBLIC_KEY}" > secrets.auto.tfvars

      - name: Terraform Init
        working-directory: live/${{ inputs.environment }}/03_vm
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: live/${{ inputs.environment }}/03_vm
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
          exit 0

      - name: Terraform Apply
        working-directory: live/${{ inputs.environment }}/03_vm
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: always()
        working-directory: live/${{ inputs.environment }}/03_vm
        run: terraform output -no-color || true

      - name: Logout
        if: always()
        run: az logout

  apply-databases:
    needs: apply-vm
    if: success() && inputs.target_layer == '04_databases'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Generate DB Secret tfvars
        working-directory: live/${{ inputs.environment }}/04_databases
        env:
          POSTGRES_PASS: ${{ secrets.POSTGRES_PRODUCTION_PASSWORD }}
          SQL_PASS: ${{ secrets.SQL_PRODUCTION_PASSWORD }}
          MONGO_PASS: ${{ secrets.MONGO_PRODUCTION_PASSWORD }}
        run: |
          {
            printf 'postgres_server_admin_passwords = {\n'
            printf '  "production_postgres" = "%s"\n' "$(printf '%s' "$POSTGRES_PASS")"
            printf '}\n'
            printf 'sql_server_admin_passwords = {\n'
            printf '  "production_sql" = "%s"\n' "$(printf '%s' "$SQL_PASS")"
            printf '}\n'
            printf 'mongodb_cluster_passwords = {\n'
            printf '  "production_mongo" = "%s"\n' "$(printf '%s' "$MONGO_PASS")"
            printf '}\n'
          } > secrets.auto.tfvars

      - name: Terraform Init
        working-directory: live/${{ inputs.environment }}/04_databases
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: live/${{ inputs.environment }}/04_databases
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
          exit 0

      - name: Terraform Apply
        working-directory: live/${{ inputs.environment }}/04_databases
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: always()
        working-directory: live/${{ inputs.environment }}/04_databases
        run: terraform output -no-color || true

      - name: Logout
        if: always()
        run: az logout

  update-docs:
    needs: apply-databases
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set docs directories
        id: dirs
        run: |
          BASE="live/${{ inputs.environment }}"
          case "${{ inputs.target_layer }}" in
            00_rg)         DIRS="$BASE/00_rg" ;;
            01_networking) DIRS="$BASE/00_rg,$BASE/01_networking" ;;
            03_vm)         DIRS="$BASE/00_rg,$BASE/01_networking,$BASE/03_vm" ;;
            04_databases)  DIRS="$BASE/00_rg,$BASE/01_networking,$BASE/03_vm,$BASE/04_databases" ;;
          esac
          echo "dirs=${DIRS}" >> $GITHUB_OUTPUT

      - name: Update Terraform Docs
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: ${{ steps.dirs.outputs.dirs }}
          output-file: README.md
          output-method: replace
          git-push: true
          git-commit-message: "docs: auto-update terraform-docs up to ${{ inputs.target_layer }}"
